name: "Alexa Skill CI (Unit Tests)"

on:
  push:
    branches: [main, develop, feat/lambda-alexa]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/alexa-*.yml"
  pull_request:
    branches: [main, develop, feat/lambda-alexa]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/alexa-*.yml"

jobs:
  test:
    name: "Executar Testes Unitarios da Skill Alexa"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Lambda-Alexa/package-lock.json"

      - name: Instalar Dependencias
        run: npm ci

      - name: Executar Testes com Node Test Runner
        run: npm test
